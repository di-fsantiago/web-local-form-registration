<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Pessoal</title>
    <!-- Faz o link com o CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cria a divisória do formulário. -->
    <div class="container">
        <h1>Cadastro Pessoal</h1>

        <!-- Foto -->
        <div class="area-foto">
            <img id="previewFoto" src="" alt="Foto do aluno" class="foto">

            <label for="foto">
                Escolha sua foto:
            </label>
            <input type="file" id="foto" accept="image/*">

        </div>

        <!-- Formulário -->
        <form id="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" required>

            <label for="endereco">Telefone:</label>
            <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="nacionalidade">Nacionalidade:</label>
            <input type="text" id="nacionalidade" required>

            <label for="naturalidade">Naturalidade:</label>
            <input type="text" id="naturalidade" placeholder="Cidade - Estado" required>

            <button type="submit">Cadastrar</button>

            <button type="button" onclick="limparFormulario()">Limpar</button>

            <script src="script.js"></script>
        </form>

        <p id="mensagem"></p>

        <h2>Cadastros Realizados</h2>
        <div id="listaCadastros"></div>
    </div>
    
</body>
</html>
